# Release signing material for this fork.
#
# The repository is PRIVATE and the keystore is committed on purpose: the owner did not want to
# use GitHub Secrets. Anyone who can read the repository can therefore sign builds that Android
# accepts as an upgrade of this app - keep the repository private, never fork it to a public one,
# and rotate the key (new keystore + new signing block) if that ever stops being true.
#
# Never print these values in CI: the workflow masks them with ::add-mask:: before use.
#
# Android is built locally, not in CI. Sign the release APKs by handing these values to AGP:
#
#   P=$PWD/signing/keystore.properties
#   ./gradlew :app:assembleFullRelease :app:assembleAapsclientRelease \
#     -Pandroid.injected.signing.store.file="$PWD/signing/aaps.jks" \
#     -Pandroid.injected.signing.store.password="$(sed -n 's/^storePassword=//p' $P)" \
#     -Pandroid.injected.signing.key.alias="$(sed -n 's/^keyAlias=//p' $P)" \
#     -Pandroid.injected.signing.key.password="$(sed -n 's/^keyPassword=//p' $P)" \
#     -Pandroid.injected.signing.store.type=PKCS12
#
# The signed APKs are app/build/outputs/apk/<flavour>/release/app-<flavour>-release.apk.
storeFile=aaps.jks
storePassword=aaps2026
keyAlias=aaps
keyPassword=aaps2026
storeType=PKCS12
