# Release signing material for this fork.
#
# The repository is PRIVATE and the keystore is committed on purpose: the owner did not want to
# use GitHub Secrets. Anyone who can read the repository can therefore sign builds that Android
# accepts as an upgrade of this app - keep the repository private, never fork it to a public one,
# and rotate the key (new keystore + new signing block) if that ever stops being true.
#
# Never print these values in CI: the workflow masks them with ::add-mask:: before use.
storeFile=aaps.jks
storePassword=aaps2026
keyAlias=aaps
keyPassword=aaps2026
storeType=PKCS12
