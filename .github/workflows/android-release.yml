name: Android release

# Builds the four Android apps this fork ships - AAPS (full), AAPSClient, AAPSClient2,
# AAPSClient3 - signs them with the keystore committed under signing/, and puts the APKs on
# GitHub. Nothing is uploaded to Google Drive.
#
# Trigger it by hand (Actions -> Android release -> Run workflow) or by pushing a v* tag, which
# additionally attaches the APKs to the GitHub Release for that tag.

on:
  workflow_dispatch:
    inputs:
      pumpcontrol:
        description: Also build the pumpcontrol APK
        type: boolean
        default: false
      wear:
        description: Also build the Wear APK (full flavour)
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # attach assets to the Release on a tag push

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk is 37, which is a preview API level: it is published on the preview channel
      # under the versioned package id android-37.0. build-tools 37.0.0 also brings apksigner.
      - name: Install platform 37 (preview channel)
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build and sign
        shell: bash
        env:
          PUMPCONTROL: ${{ inputs.pumpcontrol }}
          WEAR: ${{ inputs.wear }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          # The keystore is committed in this private repository because the owner did not want to
          # keep it in GitHub Secrets. Mask the passwords so nothing can echo them, and hand them to
          # AGP as injected signing properties so build.gradle.kts stays free of signing material.
          read_prop() { sed -n "s/^$1=//p" signing/keystore.properties | head -n 1; }
          STORE_PASSWORD="$(read_prop storePassword)"
          KEY_PASSWORD="$(read_prop keyPassword)"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          TASKS=":app:assembleFullRelease :app:assembleAapsclientRelease :app:assembleAapsclient2Release :app:assembleAapsclient3Release"
          if [ "${PUMPCONTROL:-false}" = "true" ]; then TASKS="$TASKS :app:assemblePumpcontrolRelease"; fi
          if [ "${WEAR:-false}" = "true" ]; then TASKS="$TASKS :wear:assembleFullRelease"; fi

          ./gradlew $TASKS --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/signing/aaps.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$(read_prop keyAlias)" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type="$(read_prop storeType)"

      - name: Name and verify the APKs
        shell: bash
        env:
          PUMPCONTROL: ${{ inputs.pumpcontrol }}
          WEAR: ${{ inputs.wear }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*const val appVersion = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/Versions.kt | head -n 1)"
          BOOST_VERSION="$(sed -n 's/.*const val boostVersion = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/Versions.kt | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          mkdir -p dist
          collect() { # <module> <flavour> <label>
            local src out
            src="$(find "$1/build/outputs/apk/$2/release" -maxdepth 1 -name '*-release.apk' ! -name '*-unsigned.apk' | head -n 1)"
            if [ -z "$src" ]; then
              echo "::error::no signed $1/$2 release APK found"
              exit 1
            fi
            out="dist/AAPS-${APP_VERSION}-boost-${BOOST_VERSION}-$3.apk"
            cp "$src" "$out"
            "$APKSIGNER" verify "$out"
          }

          collect app full full
          collect app aapsclient aapsclient
          collect app aapsclient2 aapsclient2
          collect app aapsclient3 aapsclient3
          if [ "${PUMPCONTROL:-false}" = "true" ]; then collect app pumpcontrol pumpcontrol; fi
          if [ "${WEAR:-false}" = "true" ]; then collect wear full wear; fi

          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aaps-boost-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
